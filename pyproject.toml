[project]
name = "zoomify"
version = "0.1.0"
description = "Gradio AI agent that extracts information from any hard-to-read image (high-res, very large/long, dense, or tiny-font) using grid + zoom vision tools."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gradio>=4.44",
    "openai>=1.40",
    "pillow>=10.0",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",
    "pyjwt[crypto]>=2.8",
    "pymongo>=4.10",
    "stripe>=11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zoomify"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
